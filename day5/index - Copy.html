<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <script src="users.js" defer></script>
</head>
<body>
  <header>
    <h1>User Directory</h1>
  </header>

  <main>
    <section>
      <button type="button" id="load-users">Load users</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section>
      <label for="filter-input">Filter by name</label>
      <input type="text" id="filter-input" name="filter" placeholder="Type a name..." autocomplete="off">
      <ul id="users-list"></ul>
    </section>
  </main>
</body>
</html>
